[project]
name = "geap-eval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic[vertex]>=2.3.0",
    "fastapi>=0.162.0",
    "google-auth>=2.62.0",
    "google-cloud-storage>=3.17.1",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "playwright>=1.64.1",
    "ptyprocess>=0.7.0",
    "pydantic>=2.14.2",
    "pyte>=0.8.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "sse-starlette>=3.6.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[project.scripts]
geap-eval = "geap_eval.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
