# Full verification run: every harness + dsh variants, single & native multi-model profiles, simple + medium tasks.
run: { name: verify-all, repeats: 1, max_task_retries: 1, retry_mode: fresh }
geap: { location: auto }   # project + identity come from .env (GEAP_PROJECT / GEAP_IDENTITY)
harnesses: [claude_code, pi, omp, agy, dsh, dsh/native, dsh/acp]
model_profiles:
  - { id: flash-low,  mode: single, roles: { default: { model: gemini-3.8-flash, thinking: low } } }
  - { id: opus-high,  mode: single, roles: { default: { model: claude-opus-5-5,  thinking: high } } }
  - id: argon-main-flash-sub
    mode: native_roles
    roles: { default: { model: gemini-4-argon, thinking: low }, subagent: { model: gemini-3.8-flash, thinking: low } }
tasks: { include: ["banking/iban-checksum-bug", "telecom/cdr-tiered-tariff"] }
limits: { quiescence_s: 10, max_nudges: 2, attempt_timeout_s: { simple: 900, medium: 1500, complex: 3600 } }
budget: { enabled: true, max_usd_total: 25, max_usd_per_attempt: 3, on_exceed: pause }
concurrency: { global: 5, per_harness: 2 }
