# Verifies the three capability fixes on the wire (Vertex AI mode only).
run: { name: dev-gaps, repeats: 1, max_task_retries: 0 }
harnesses: [pi, omp, agy]
model_profiles:
  - { id: opus-low,  roles: { default: { model: claude-opus-5-5, thinking: low } } }
  - { id: opus-max,  roles: { default: { model: claude-opus-5-5, thinking: max } } }
  - { id: flash-low, roles: { default: { model: gemini-3.8-flash, thinking: low } } }
tasks: ["energy/tou-billing"]
budget: { enabled: true, max_usd_total: 8, max_usd_per_attempt: 2 }
concurrency: { global: 4, per_harness: 2 }
