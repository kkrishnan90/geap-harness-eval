<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>GEAP Harness Eval</title>
    <script>
      var sys = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; try { var t = localStorage.getItem('geap.theme'); document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : sys; } catch (e) { document.documentElement.dataset.theme = sys; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
